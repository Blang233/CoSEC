<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cosecBlue" x1="24" y1="20" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5C7CFA"/>
      <stop offset="100%" stop-color="#3F51B5"/>
    </linearGradient>

    <linearGradient id="cosecEvent" x1="50" y1="32" x2="88" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E293B" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Transparent background -->

  <!-- Soft circular base -->
  <circle cx="64" cy="64" r="48" fill="#EEF2FF" filter="url(#softShadow)"/>

  <!-- Main C-shaped coaxial body -->
  <path
    d="M86 35
       C78 28 66 25 55 28
       C39 32 28 47 28 64
       C28 81 39 96 55 100
       C67 103 79 100 87 92"
    fill="none"
    stroke="url(#cosecBlue)"
    stroke-width="12"
    stroke-linecap="round"
  />

  <!-- Coaxial outer ring -->
  <circle
    cx="64"
    cy="64"
    r="24"
    fill="none"
    stroke="#3F51B5"
    stroke-width="5"
  />

  <!-- Coaxial inner ring -->
  <circle
    cx="64"
    cy="64"
    r="12"
    fill="none"
    stroke="url(#cosecEvent)"
    stroke-width="5"
  />

  <!-- Event center -->
  <circle cx="64" cy="64" r="4.5" fill="#00D4FF"/>

  <!-- Stereo alignment rays -->
  <line
    x1="64"
    y1="64"
    x2="94"
    y2="47"
    stroke="#00D4FF"
    stroke-width="4"
    stroke-linecap="round"
  />
  <line
    x1="64"
    y1="64"
    x2="94"
    y2="81"
    stroke="#7C4DFF"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Sensor nodes -->
  <circle cx="97" cy="45" r="4" fill="#00D4FF"/>
  <circle cx="97" cy="83" r="4" fill="#7C4DFF"/>
</svg>
